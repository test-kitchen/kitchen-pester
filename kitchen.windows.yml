---
driver:
  name: proxy
  host: localhost
  reset_command: "exit 0"
  port: 5985

# Credentials belong to the transport; the proxy driver only supplies the host.
transport:
  name: winrm
  username: <%= ENV["MACHINE_USER"] %>
  password: <%= ENV["MACHINE_PASS"] %>

provisioner:
  name: shell
  script: provision.ps1

platforms:
  - name: windows

verifier:
  name: pester
  # The runner's built-in modules are fine; removing them (the default) leaves
  # the session without Get-PSRepository and the Pester install then fails.
  remove_builtin_pester: false
  remove_builtin_powershellget: false
  environment:
    API_KEY: Some key value
    PUSH_REPO: https://push.example.com
  downloads:
    "PesterTestResults.xml": "testresults/%{instance_name}/"

suites:
  # Whatever Pester the gallery currently ships, which is 5.x. Exercises the
  # New-PesterConfiguration branch of #invoke_pester_scriptblock.
  - name: default

  # Pinned to Pester 4, which takes loose Invoke-Pester parameters instead.
  # pester_install replaces the default hash rather than merging into it, so
  # the defaults it would otherwise supply are repeated here.
  - name: pester4
    verifier:
      pester_install:
        MaximumVersion: "4.99.999"
        SkipPublisherCheck: true
        Force: true
        ErrorAction: Stop
